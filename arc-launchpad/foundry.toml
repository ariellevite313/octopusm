[profile.default]
src      = "src"
test     = "test"
script   = "script"
out      = "out"
libs     = ["lib"]
solc     = "0.8.26"
optimizer        = true
optimizer_runs   = 200
via_ir           = true
evm_version      = "cancun"   # Required for V4 (EIP-1153 transient storage)

[rpc_endpoints]
arc_mainnet = "https://rpc.mainnet.arc.io"  # Chain ID 5042 — Arc Mainnet

[etherscan]
arc_mainnet = { key = "${ETHERSCAN_KEY}", url = "https://explorer.arc.io/api" }

[fmt]
line_length  = 100
tab_width    = 4
bracket_spacing = true
